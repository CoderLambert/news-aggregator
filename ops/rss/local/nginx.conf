# No host listener. Only the restricted CONNECT proxy can reach this TLS origin.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr error;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 443 ssl;
    listen 1200;
    server_name rsshub.newshub.example;
    ssl_certificate /run/rsshub/tls/server.pem;
    ssl_certificate_key /run/rsshub/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host !~ ^(rsshub\.newshub\.example|127\.0\.0\.1|localhost)$) { return 403; }
    if ($request_method != GET) { return 405; }
    # Service endpoints and the explicitly paused namespace are not feeds.
    location ~* ^/(api|metrics|healthz|config|debug|twitter)(/|$) { return 403; }
    location = /robots.txt { return 403; }
    location / {
      set $rsshub http://rsshub:1200;
      proxy_pass $rsshub$request_uri;
      proxy_set_header Host rsshub;
      proxy_set_header Authorization '';
      proxy_set_header Cookie '';
      proxy_set_header X-Forwarded-For '';
      proxy_set_header X-Forwarded-Host '';
      proxy_set_header X-Forwarded-Proto '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_buffering off;
      proxy_intercept_errors on;
      error_page 301 302 303 307 308 =502 /blocked-redirect;
    }
    location = /blocked-redirect { internal; return 502; }
  }
}
