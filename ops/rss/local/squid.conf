# A trusted hop for exactly one TLS gateway, never an Internet/general proxy.
http_port 3128
visible_hostname newshub-rsshub-proxy
pid_filename /tmp/squid.pid
access_log none
cache_log /dev/stderr
cache_store_log none
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 1 seconds
acl tunnel method CONNECT
acl tls port 443
acl gateway dstdomain -n rsshub.newshub.example
# Literal URL guard additionally rejects alternate spelling/port/subdomains.
acl exact_gateway url_regex ^rsshub\.newshub\.example:443$
http_access allow tunnel tls gateway exact_gateway
http_access deny all
