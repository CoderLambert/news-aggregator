# Local-only overlay for the existing NewsHub + Miniflux project.
# Do not include in production. Bootstrap TLS/config per README.md first.
services:
  rsshub:
    image: diygod/rsshub@sha256:1945d3162e0a6a38399bed540b623bbb06829ad3dc9160de7e7dfbaac60854ff
    user: '1000:1000'
    entrypoint: [dumb-init, --]
    command: [node, --dns-result-order=ipv4first, --no-network-family-autoselection, --max-http-header-size=32768, dist/index.mjs]
    environment:
      NODE_ENV: production
      HOME: /tmp
      CACHE_TYPE: memory
      MEMORY_MAX: '64'
      CACHE_EXPIRE: '300'
      REQUEST_RETRY: '1'
      REQUEST_TIMEOUT: '20000'
      LOGGER_LEVEL: error
      NO_LOGFILES: 'true'
      DEBUG_INFO: 'false'
      DISALLOW_ROBOT: 'true'
      ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: 'false'
      PROXY_URI: http://rsshub-egress-proxy:3128
    # No external route: even a route that ignores PROXY_URI cannot bypass it.
    dns: ['${RSSHUB_DNS_SANDBOX_IP:?Set the sandbox resolver IPv4 address}']
    networks: [rsshub-sandbox]
    depends_on: [rsshub-egress-proxy]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
  rsshub-gateway:
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    user: '1000:1000'
    entrypoint: [nginx, -c, /run/rsshub/nginx.conf, -g, 'daemon off;']
    volumes:
      - '${RSSHUB_LOCAL_CONFIG_DIR:?Set local config directory}/nginx.conf:/run/rsshub/nginx.conf:ro'
      - '${RSSHUB_LOCAL_TLS_DIR:?Set local TLS directory}/server.pem:/run/rsshub/tls/server.pem:ro'
      - '${RSSHUB_LOCAL_TLS_DIR:?Set local TLS directory}/server.key:/run/rsshub/tls/server.key:ro'
    ports: ['127.0.0.1:${RSSHUB_LOCAL_PORT:-1200}:1200']
    networks:
      rsshub-link:
        aliases: [rsshub.newshub.example]
      rsshub-sandbox: {}
      rsshub-egress: {}
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      rsshub: {condition: service_healthy}
  rsshub-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    user: '13:13'
    entrypoint: [/usr/sbin/squid, -f, /run/rsshub/squid.conf, -NYC]
    volumes: ['${RSSHUB_LOCAL_CONFIG_DIR:?Set local config directory}/squid.conf:/run/rsshub/squid.conf:ro']
    networks: [rsshub-link]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,uid=13,gid=13']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 96m
    restart: unless-stopped
    depends_on: [rsshub-gateway]
  rsshub-dns:
    image: adguard/dnsproxy@sha256:4d65bafbf246b206a1af35d4263a86c35451d957458c7836304199f1cd2c1535
    user: '65534:65534'
    command: [--listen, 0.0.0.0, --port, '53', --upstream, 'https://1.1.1.1/dns-query', --cache, --ipv6-disabled]
    networks:
      rsshub-sandbox:
        ipv4_address: '${RSSHUB_DNS_SANDBOX_IP:?Set the sandbox resolver IPv4 address}'
      rsshub-egress:
        ipv4_address: '${RSSHUB_DNS_EGRESS_IP:?Set the egress resolver IPv4 address}'
    read_only: true
    cap_drop: [ALL]
    # Official binary carries this file capability, required even as non-root.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped
  rsshub-egress-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    user: '13:13'
    entrypoint: [/usr/sbin/squid, -f, /run/rsshub/egress.conf, -NYC]
    volumes: ['${RSSHUB_LOCAL_CONFIG_DIR:?Set local config directory}/egress.conf:/run/rsshub/egress.conf:ro']
    networks: [rsshub-sandbox, rsshub-egress]
    read_only: true
    tmpfs: ['/tmp:rw,nosuid,nodev,noexec,size=32m,uid=13,gid=13']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 96m
    restart: unless-stopped
    depends_on: [rsshub-dns]
  miniflux:
    environment:
      FETCHER_ALLOW_PRIVATE_NETWORKS: '0'
      SSL_CERT_FILE: /run/rsshub/ca-bundle.pem
    volumes: ['${RSSHUB_LOCAL_TLS_DIR:?Set local TLS directory}/ca-bundle.pem:/run/rsshub/ca-bundle.pem:ro']
    networks:
      rsshub-link: {}
networks:
  rsshub-sandbox:
    internal: true
    ipam:
      config: [{subnet: '${RSSHUB_SANDBOX_SUBNET:?Choose an unused isolated subnet}'}]
  rsshub-link:
    internal: true
    ipam:
      config: [{subnet: '${RSSHUB_LOCAL_LINK_SUBNET:?Choose an unused private subnet}'}]
  rsshub-egress:
    driver: bridge
    ipam:
      config: [{subnet: '${RSSHUB_LOCAL_EGRESS_SUBNET:?Choose a second unused private subnet}'}]
