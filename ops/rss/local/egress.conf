# Mandatory public-only HTTP(S) exit for sandboxed RSSHub. No host port.
http_port 3128
visible_hostname newshub-rsshub-egress
pid_filename /tmp/squid.pid
access_log none
cache_log /dev/stderr
cache_store_log none
cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
coredump_dir /tmp
pinger_enable off
shutdown_lifetime 1 seconds
# Render this operator-owned placeholder to the dedicated DoH resolver IP.
dns_nameservers @RSSHUB_DNS_EGRESS_IP@
dns_timeout 10 seconds
connect_timeout 8 seconds
request_timeout 40 seconds
acl http_proto proto HTTP HTTPS
acl web_ports port 80 443
acl tunnel method CONNECT
acl tls port 443
# Fail closed for private, special-use, fake-IP, multicast and private IPv6 here.
# The local host has a broken IPv6 path; DNS emits A records only.
acl non_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 ::/96 64:ff9b::/96 64:ff9b:1::/48 100::/64 2001::/23 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl ipv6_literal url_regex -i ^\[ ^https?://\[
http_access deny ipv6_literal
http_access deny !web_ports
http_access deny tunnel !tls
http_access deny non_public
http_access allow tunnel
http_access allow http_proto
http_access deny all
