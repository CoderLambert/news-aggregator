services:
  app:
    build:
      context: .
    image: news-aggregator:local
    env_file:
      - path: .env
        required: false
    environment:
      # Avoid downloading/loading the embedding model during server startup.
      RUN_MAIN: "true"
    ports:
      - "127.0.0.1:9527:9527"
    volumes:
      # Keep SQLite, its WAL sidecars, and application data on the host. The
      # frontend bundle stays inside the image so a rebuild cannot be masked by
      # stale files from ./frontend/dist.
      - ./backend:/app/backend
      - ./chroma_data:/app/chroma_data
      - ./logs:/app/logs
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9527/api/news/', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

  indexer:
    build:
      context: .
    image: news-aggregator:local
    command: ["python", "/app/backend/manage.py", "embedding_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      # The worker loads the local model only when a run needs embeddings.
      RUN_MAIN: "true"
      SEARCH_INDEX_ENABLED: "${SEARCH_INDEX_ENABLED:-1}"
    volumes:
      - ./backend:/app/backend
      - ./chroma_data:/app/chroma_data
      - ./logs:/app/logs
      - huggingface-cache:/root/.cache/huggingface
    depends_on:
      app:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "/app/backend/manage.py", "embedding_healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s

volumes:
  huggingface-cache:
