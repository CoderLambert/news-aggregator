# Temporary HTTP-only vhost for the first ACME challenge. It does not refer
# to a certificate and deliberately serves no application content.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name news.lambert.host;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
