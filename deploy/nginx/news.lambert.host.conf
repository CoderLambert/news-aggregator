server {
    listen 80;
    server_name news.lambert.host;
    if ($host != news.lambert.host) { return 444; }
    if ($http_host !~* "^news[.]lambert[.]host(:80|:443)?$") { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://news.lambert.host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name news.lambert.host;
    if ($host != news.lambert.host) { return 444; }
    if ($http_host !~* "^news[.]lambert[.]host(:80|:443)?$") { return 444; }

    ssl_certificate /etc/letsencrypt/live/news.lambert.host/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/news.lambert.host/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/newshub/current;
    index index.html;

    location = /api {
        proxy_pass http://127.0.0.1:9527;
        include /etc/nginx/snippets/newshub-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    # The no-URI proxy_pass form preserves /api/... so unknown API paths stay
    # upstream 404s instead of falling through to the SPA.
    location /api/ {
        proxy_pass http://127.0.0.1:9527;
        include /etc/nginx/snippets/newshub-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    # Only these exact event-stream endpoints disable response buffering.
    location ~ ^/api/news/[0-9]+/(?:chat|translate)/$ {
        proxy_pass http://127.0.0.1:9527;
        include /etc/nginx/snippets/newshub-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/research/ {
        proxy_pass http://127.0.0.1:9527;
        include /etc/nginx/snippets/newshub-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location ~ "^/api/research/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/(?:chat|stream)/$" {
        proxy_pass http://127.0.0.1:9527;
        include /etc/nginx/snippets/newshub-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /favicon.ico {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /icons.svg {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /favicon-16x16.png {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /favicon-32x32.png {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /apple-touch-icon.png {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Vite hash names get immutable caching only for successful responses.
    location ~* "^/assets/(?:.*/)?[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" {
        root /srv/newshub;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        root /srv/newshub;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Static files outside /assets never become SPA responses when missing.
    location ~* ^/(?!api/|assets/).+\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
