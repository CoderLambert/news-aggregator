services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: synthetic-recovery-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U recovery]
      interval: 1s
      retries: 40
  engine:
    image: miniflux/miniflux:2.3.3
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://recovery:synthetic-recovery-only@db/recovery?sslmode=disable
      RUN_MIGRATIONS: '1'
      CREATE_ADMIN: '1'
      ADMIN_USERNAME: synthetic_admin
      ADMIN_PASSWORD: synthetic-recovery-admin
      POLLING_FREQUENCY: '999999'
      LOG_LEVEL: error
      FETCHER_ALLOW_PRIVATE_NETWORKS: '1'
      SSL_CERT_FILE: /certs/ca.pem
    volumes: [../recovery_lab/certs:/certs:ro]
  fixture:
    image: python:3.12.12-alpine3.22
    command: [python, /fixture/server.py]
    volumes: [./server.py:/fixture/server.py:ro, ../recovery_lab/certs:/certs:ro]
    networks:
      default:
        aliases: [fixture.example]
  rsshub:
    image: diygod/rsshub@sha256:1945d3162e0a6a38399bed540b623bbb06829ad3dc9160de7e7dfbaac60854ff
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: '300'
      REQUEST_RETRY: '1'
      REQUEST_TIMEOUT: '15000'
      LOGGER_LEVEL: error
      NO_LOGFILES: 'true'
      DEBUG_INFO: 'false'
      ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: 'false'
    mem_limit: 384m
