# Development overlay: docker compose -f compose.yaml -f compose.workspace.yaml up -d channel-worker
services:
  app:
    environment:
      CHANNEL_WORKER_HEARTBEAT: /app/logs/channel-worker-heartbeat.json

  channel-worker:
    image: news-aggregator:local
    build:
      context: .
    command: ["python", "/app/backend/manage.py", "channel_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      RUN_MAIN: "true"
      NEWS_CRAWL_ONLY: "1"
      CHANNEL_WORKER_HEARTBEAT: /app/logs/channel-worker-heartbeat.json
    # Same network namespace as the app: do not change the existing BYOK
    # loopback gateway trust boundary or expose another HTTP service.
    network_mode: service:app
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "/app/backend/manage.py", "channel_worker_healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
