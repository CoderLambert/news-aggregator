name: CI pytest parallel benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ops/ci/benchmark-xdist.sh'
      - '.github/workflows/ci-pytest-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

# The same isolated backend runner serves the normal release workflow.
# Benchmark queues rather than contends with other backend jobs.
concurrency:
  group: newshub-xdist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-xdist-lab:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: [self-hosted, linux, x64, newshub-ci]
    timeout-minutes: 60
    env:
      PYTHONPATH: backend:crawler
      RUN_MAIN: 'true'
      CI_XDIST_REPEATS: '3'
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify private runner environment
        run: |
          test "$DOCKER_HOST" = unix:///ci-docker/docker.sock
          test -w "$TMPDIR"
          test "$(python3 -c 'import sys;print(".".join(map(str,sys.version_info[:2])))')" = 3.12
          docker info >/dev/null
      - name: Reuse backend venv
        run: bash ops/ci/install-backend-deps.sh
      - name: Three full xdist loadfile runs
        run: bash ops/ci/benchmark-xdist.sh
