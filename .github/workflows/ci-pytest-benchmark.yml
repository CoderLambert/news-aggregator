name: CI pytest parallel benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

# The same isolated backend runner serves the normal release workflow.
# Manual profiling only: normal Ready/main CI already runs one full round.
# Do not queue three additional rounds for ordinary CI-script PRs.
concurrency:
  group: newshub-xdist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-xdist-lab:
    runs-on: [self-hosted, linux, x64, newshub-ci]
    timeout-minutes: 60
    env:
      PYTHONPATH: backend
      RUN_MAIN: 'true'
      CI_XDIST_REPEATS: '3'
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify private runner environment
        run: |
          test "$DOCKER_HOST" = unix:///ci-docker/docker.sock
          test -w "$TMPDIR"
          test "$(python3 -c 'import sys;print(".".join(map(str,sys.version_info[:2])))')" = 3.12
          docker info >/dev/null
      - name: Reuse backend venv
        run: bash ops/ci/install-backend-deps.sh
      - name: Three full hybrid serial/xdist coverage runs
        run: bash ops/ci/with-translation-redis.sh bash ops/ci/benchmark-xdist.sh
