name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Avoid duplicate PR push runs and discard obsolete checks on new commits.
concurrency:
  group: newshub-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap routing only: run on the frontend listener, with no Docker or caches.
  # A missing Git commit, unexpected path or detection failure runs both suites.
  changes:
    if: >-
      ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) }}
    runs-on: [self-hosted, linux, x64, newshub-frontend]
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.route.outputs.frontend }}
      backend: ${{ steps.route.outputs.backend }}
    steps:
      - name: Check out source and history for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify offline routing regressions
        run: python3 -m unittest discover -s ops/ci/tests -p 'test_change_scope.py'
      - name: Route changed files; unknown means both
        id: route
        env:
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 ops/ci/change_scope.py

  frontend:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true')) }}
    # Dedicated frontend listener: no Docker daemon access and no backend cache.
    runs-on: [self-hosted, linux, x64, newshub-frontend]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify isolated frontend runner and Node.js 22
        run: |
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 22
          test -z "${DOCKER_HOST:-}"
          test ! -S /ci-docker/docker.sock
      - name: Fast cross-stack syntax preflight
        # Run without fetching Python or npm dependencies. The frontend Runner
        # has Python 3.12, but NO DinD access or backend cache.
        run: |
          python3 -m compileall -q backend/api backend/newsaggregator crawler scripts/deploy ops/ci
          bash -n ops/ci/*.sh scripts/deploy/*.sh scripts/deploy/tests/*.sh
      - name: Restore installed frontend deps from lockfile-keyed local cache
        run: bash ops/ci/install-frontend-deps.sh
      - name: Check frontend types
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm run test:run
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-and-release-gates:
    needs: changes
    if: >-
      ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.changes.result == 'success' && needs.changes.outputs.backend == 'true')) }}
    runs-on: [self-hosted, linux, x64, newshub-ci]
    timeout-minutes: 90
    env:
      PYTHONPATH: backend:crawler
      RUN_MAIN: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify isolated Docker daemon and shared workspace
        run: |
          python3 --version
          test "$(python3 -c 'import sys; print(".".join(map(str,sys.version_info[:2])))')" = 3.12
          test "$DOCKER_HOST" = unix:///ci-docker/docker.sock
          test -x "$CHROMIUM_EXECUTABLE"
          test -w "$TMPDIR"
          echo "CI job identity: $(id)"
          stat -c 'DinD socket mode=%a owner-uid=%u group-gid=%g' /ci-docker/docker.sock
          if ! docker info >/dev/null; then
            echo 'Runner cannot access private DinD. Check Docker Socket group 121, dockerd --group, and non-root gosu runner permissions.' >&2
            exit 1
          fi
          docker compose version
          # Private DinD stores the Alpine probe image between CI runs. A
          # missing image must be fetched exactly once; DNS failures must
          # report an actionable error rather than obscure a mount check.
          if ! docker image inspect alpine:3.22 >/dev/null 2>&1; then
            for attempt in 1 2 3; do
              docker pull alpine:3.22 && break
              if [ "$attempt" -eq 3 ]; then
                echo 'Private DinD cannot pull Alpine. Verify CI_DIND_DNS_PRIMARY/SECONDARY and the host outbound DNS/proxy.' >&2
                exit 1
              fi
              sleep "$((attempt * 3))"
            done
          fi
          docker run --rm --pull=never --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/ci-src,readonly" \
            alpine:3.22 test -f /ci-src/.github/workflows/ci.yml
          docker run --rm --pull=never --network none \
            --mount "type=bind,source=$TMPDIR,target=/ci-tmp,readonly" \
            alpine:3.22 test -d /ci-tmp
      - name: Reuse checked backend environment from persistent cache
        run: bash ops/ci/install-backend-deps.sh
      - name: Fast backend security regressions
        # Fail on relevant security regressions before the full 2400+ suite.
        # The complete suite below still runs all three test roots.
        run: |
          backend/venv/bin/python -m pytest -q --maxfail=1 --tb=short \
            backend/api/tests/test_article_fetcher_security.py \
            backend/api/tests/test_research_csrf.py \
            scripts/deploy/tests/test_nginx_templates.py
      - name: Verify private self-hosted CI contract
        run: backend/venv/bin/python -m unittest discover -s ops/ci/tests -p 'test_*.py'
      - name: Verify BYOK T00 isolated SDK and Proxy contracts
        timeout-minutes: 12
        run: |
          t00_env="$(mktemp -d "${TMPDIR:?}/newshub-t00.XXXXXX")"
          trap 'rm -rf "$t00_env"' EXIT
          python3 -m venv "$t00_env/sdk"
          python3 -m venv "$t00_env/proxy"
          "$t00_env/sdk/bin/python" -m pip install --disable-pip-version-check --no-input -r tools/byok_t00_probe/requirements-sdk.lock
          "$t00_env/proxy/bin/python" -m pip install --disable-pip-version-check --no-input -r tools/byok_t00_probe/requirements-proxy.lock
          "$t00_env/proxy/bin/python" tools/byok_t00_probe/prepare_proxy.py
          "$t00_env/sdk/bin/python" -m unittest discover -s tools/byok_t00_probe -p 'test_*.py'
          "$t00_env/sdk/bin/python" tools/byok_t00_probe/probe.py --proxy-python "$t00_env/proxy/bin/python" --report "$t00_env/report.json"
      - name: Validate release shell syntax and mocked script behavior
        run: |
          bash -n scripts/deploy/smoke.sh scripts/deploy/deploy.sh scripts/deploy/rollback.sh scripts/deploy/backup.sh scripts/deploy/restore.sh scripts/deploy/tests/test_release_scripts.sh
          bash scripts/deploy/tests/test_release_scripts.sh
          bash scripts/deploy/tests/test_export_static.sh
          bash scripts/deploy/tests/test_preflight.sh
          bash scripts/deploy/tests/test_local_domain_args.sh
      - name: Run backend and offline deployment tests
        # Fail-closed hybrid: seven seed/state-sensitive modules stay serial;
        # remaining files use two isolated xdist workers. All three test roots
        # are covered and the authoritative terminal/JUnit totals are checked.
        # One round is sufficient for normal CI; the separate benchmark still
        # runs three repeated rounds for safety experiments.
        env:
          CI_XDIST_REPEATS: '1'
        run: bash ops/ci/benchmark-xdist.sh
      - name: Check production Django settings with synthetic values
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: CI-only-synthetic-strong-secret-not-a-credential-9876543210-abcdef
          WAITRESS_TRUSTED_PROXY: 127.0.0.1
          DJANGO_DB_PATH: /tmp/newshub-ci-check.sqlite3
        run: backend/venv/bin/python backend/manage.py check --deploy
      - name: Verify cached Playwright package and preinstalled Chromium
        run: |
          backend/venv/bin/python -m playwright --version
          test -x "$CHROMIUM_EXECUTABLE"
      - name: Build the non-root production image
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEWSHUB_IMAGE: newshub:ci-${{ github.sha }}
        run: docker build --target production --build-arg "RELEASE_SHA=$RELEASE_SHA" --tag "$NEWSHUB_IMAGE" .
      - name: Build cached isolated G1 probe image
        # G1 HTTP, Chromium and SSE must run inside DinD's gateway network.
        # A persistent DinD Docker volume caches browser and Python image layers.
        run: docker build --file ops/ci/g1-probe.Dockerfile --tag newshub:ci-g1-probe .

      - name: Reuse cached smoke Nginx image or pull first time
        run: |
          image=nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
      - name: Run isolated G1 local-domain smoke
        env:
          RELEASE_SHA: ${{ github.sha }}
          NEWSHUB_IMAGE: newshub:ci-${{ github.sha }}
          PYTHON_BIN: ${{ github.workspace }}/backend/venv/bin/python
          LOCAL_DOMAIN_G1_PROBE_IMAGE: newshub:ci-g1-probe
        run: scripts/deploy/local-domain-smoke.sh --execute --image "$NEWSHUB_IMAGE" --sha "$RELEASE_SHA" --nginx-image nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
      - name: Report bounded cache usage
        if: always()
        run: bash ops/ci/cache-summary.sh
